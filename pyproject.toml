[project]
name = "synkoala-backend"
version = "0.1.0"
description = "Synthetic Koala backend API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "cryptography>=43.0",
  "python-multipart>=0.0.12",
  "langgraph>=1.2.11",
  "pydantic-ai-slim[anthropic,openai]>=2.43.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "black>=24.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()-as-default-arg is the required DI pattern, not a bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerate always emits long sa.Column(...) lines; not worth hand-wrapping
# generated code that gets regenerated on every future revision.
"alembic/versions/*.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "alembic/versions/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
